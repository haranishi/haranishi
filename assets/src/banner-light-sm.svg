<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 274" width="560" height="274" role="img" aria-label="Ikki Nishihara — product builder at Lilac">
  <title>Ikki Nishihara — Product Builder, Lilac</title>

  <!-- Phone crop of banner-light.svg. See banner-dark-sm.svg for why the crop exists. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9ff"/>
      <stop offset="0.55" stop-color="#e2d8fd"/>
      <stop offset="1" stop-color="#d3c4fa"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#6d28d9"/>
    </pattern>

    <linearGradient id="dotfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <mask id="dotmask"><rect width="560" height="250" fill="url(#dotfade)"/></mask>

    <clipPath id="round"><rect width="560" height="250" rx="8"/></clipPath>
  </defs>

  <style>
    .float  { animation: drift 7s ease-in-out infinite; }
    .float2 { animation: drift 7s ease-in-out infinite; animation-delay: -2.3s; }
    .float3 { animation: drift 7s ease-in-out infinite; animation-delay: -4.6s; }
    .pulse  { animation: breathe 7s ease-in-out infinite; }
    @keyframes drift   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes breathe { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .float2, .float3, .pulse { animation: none; }
    }
    .name { font: 700 54px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .kick { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.6px; }
    .sub  { font: 400 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <g clip-path="url(#round)">
    <rect width="560" height="250" fill="url(#bg)"/>
    <rect width="560" height="250" fill="url(#dots)" mask="url(#dotmask)" opacity="0.75"/>
    <ellipse cx="450" cy="70" rx="150" ry="105" fill="url(#glow)" class="pulse"/>

    <g stroke-linejoin="round">
      <g class="float">
        <path d="M450 44 L502 70 L450 96 L398 70 Z" fill="url(#face)" stroke="#6d28d9" stroke-opacity="0.55" stroke-width="1.4"/>
      </g>
      <g class="float2">
        <path d="M450 18 L502 44 L450 70 L398 44 Z" fill="url(#face)" stroke="#5b21b6" stroke-opacity="0.75" stroke-width="1.4"/>
        <circle cx="450" cy="18" r="2.6" fill="#5b21b6"/>
      </g>
      <g class="float3">
        <path d="M450 70 L502 96 L450 122 L398 96 Z" fill="none" stroke="#7c3aed" stroke-opacity="0.40" stroke-width="1.4" stroke-dasharray="4 5"/>
      </g>
    </g>

    <text class="name" x="26" y="156" fill="#1f2328">Ikki Nishihara</text>
    <rect x="28" y="172" width="100" height="2" rx="1" fill="url(#rule)"/>
    <text class="sub" x="28" y="206" fill="#5b21b6">西原 一輝</text>
    <text class="kick" x="28" y="238" fill="#3f4650">SOLO PRODUCT BUILDER · JAPAN · LILAC</text>
  </g>
</svg>
