<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title description" overflow="hidden">
  <title id="title">西原 一輝 — Neon Air Combat Loop</title>
  <desc id="description">テトリス風ブロックが落下し、架空の戦闘機が飛来して西原 一輝の名前を出現させ、追撃機のミサイルで名前が砕けて再び始まるアニメーション</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b2c"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".3" stop-color="#a78bfa"/><stop offset=".55" stop-color="#fb7185"/><stop offset=".78" stop-color="#fbbf24"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <radialGradient id="skyGlow"><stop stop-color="#0ea5e9" stop-opacity=".28"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".1"/><stop offset="1" stop-color="#070a11" stop-opacity="0"/></radialGradient>
    <radialGradient id="blast"><stop stop-color="#fff"/><stop offset=".22" stop-color="#fde047"/><stop offset=".58" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frameClip"><rect width="880" height="300" rx="20"/></clipPath>
    <style>
      .combat-field { animation: impact-shake 8.4s linear infinite; transform-box: fill-box; transform-origin: center; }
      .speed-lines { animation: speed-lines .62s linear infinite; }
      .star { animation: twinkle .9s ease-in-out infinite alternate; }.s2 { animation-delay:-.3s }.s3 { animation-delay:-.6s }
      .tetro { opacity:0; animation:tetris-fall 8.4s cubic-bezier(.2,.8,.2,1) infinite; transform-box:fill-box; transform-origin:center; filter:url(#glow); }
      .t2 { animation-delay:.08s }.t3 { animation-delay:.16s }.t4 { animation-delay:.24s }.t5 { animation-delay:.32s }
      .lead-jet { opacity:0; animation:lead-flight 8.4s cubic-bezier(.18,.72,.22,1) infinite; transform-box:fill-box; transform-origin:center; filter:url(#glow); }
      .chaser-jet { opacity:0; animation:chase-flight 8.4s cubic-bezier(.2,.68,.2,1) infinite; transform-box:fill-box; transform-origin:center; filter:url(#glow); }
      .engine { animation:engine-pulse .16s steps(2,end) infinite alternate; transform-box:fill-box; transform-origin:right center; }
      .sonic-ring { opacity:0; animation:sonic-boom 8.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .name-holder { opacity:0; animation:name-reveal 8.4s cubic-bezier(.18,.85,.2,1) infinite; transform-box:fill-box; transform-origin:center; }
      .h2 { animation-delay:.06s }.h3 { animation-delay:.12s }.h4 { animation-delay:.18s }
      .fragment { transform-box:fill-box; transform-origin:center; }
      .f1 { animation:break-one 8.4s ease-in infinite }.f2 { animation:break-two 8.4s ease-in infinite }.f3 { animation:break-three 8.4s ease-in infinite }.f4 { animation:break-four 8.4s ease-in infinite }
      .tile-glint { animation:glint .7s ease-in-out infinite alternate; }
      .missile { opacity:0; animation:missile-flight 8.4s cubic-bezier(.35,.15,.72,.55) infinite; transform-box:fill-box; transform-origin:center; filter:url(#glow); }
      .missile-flame { animation:engine-pulse .1s steps(2,end) infinite alternate; transform-box:fill-box; transform-origin:right center; }
      .explosion { opacity:0; animation:explosion 8.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .blast-rays { opacity:0; animation:blast-rays 8.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .debris { opacity:0; animation:debris 8.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .smoke { opacity:0; animation:smoke 8.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      .flash { opacity:0; animation:flash 8.4s steps(2,end) infinite; }
      .status { opacity:0; animation:status 8.4s steps(1,end) infinite; }
      .reset { opacity:0; animation:reset 8.4s steps(5,end) infinite; transform-box:fill-box; transform-origin:center; }
      .reset-ring { animation:spin .7s linear infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes tetris-fall { 0%,2%{opacity:0;transform:translateY(-290px) rotate(0) scale(.65)} 7%{opacity:1} 15%{transform:translateY(-120px) rotate(90deg) scale(.9)} 20%,25%{opacity:1;transform:translateY(0) rotate(180deg) scale(1)} 29%{opacity:0;transform:translateY(4px) rotate(270deg) scale(1.35)} 30%,100%{opacity:0} }
      @keyframes lead-flight { 0%,16%{opacity:0;transform:translate(-170px,235px) rotate(-14deg) scale(.8)} 18%{opacity:1} 30%{opacity:1;transform:translate(385px,112px) rotate(-8deg) scale(1.08)} 42%{opacity:1;transform:translate(1010px,34px) rotate(-5deg) scale(.9)} 43%,100%{opacity:0;transform:translate(1010px,34px)} }
      @keyframes chase-flight { 0%,34%{opacity:0;transform:translate(-160px,260px) rotate(-13deg) scale(.72)} 36%{opacity:1} 50%{opacity:1;transform:translate(40px,200px) rotate(-9deg) scale(.88)} 63%{opacity:1;transform:translate(80px,175px) rotate(-7deg) scale(.94)} 72%{opacity:.8;transform:translate(480px,100px) rotate(-6deg) scale(.8)} 78%,100%{opacity:0;transform:translate(920px,50px) scale(.6)} }
      @keyframes sonic-boom { 0%,29%{opacity:0;transform:scale(.2)} 32%{opacity:1;transform:scale(.5)} 42%,100%{opacity:0;transform:scale(4.5)} }
      @keyframes name-reveal { 0%,29%{opacity:0;transform:perspective(500px) scale(.35) rotateY(-100deg)} 34%{opacity:1;transform:perspective(500px) scale(1.18) rotateY(12deg)} 38%,67%{opacity:1;transform:perspective(500px) scale(1) rotateY(0)} 72%{opacity:1} 82%,100%{opacity:0} }
      @keyframes break-one { 0%,67%{transform:translate(0) rotate(0)} 70%{transform:translate(-4px,3px) rotate(-4deg)} 82%,100%{transform:translate(-150px,135px) rotate(-220deg) scale(.45)} }
      @keyframes break-two { 0%,67%{transform:translate(0) rotate(0)} 70%{transform:translate(3px,-3px) rotate(5deg)} 82%,100%{transform:translate(-55px,170px) rotate(160deg) scale(.5)} }
      @keyframes break-three { 0%,67%{transform:translate(0) rotate(0)} 70%{transform:translate(-2px,-4px) rotate(-5deg)} 82%,100%{transform:translate(70px,165px) rotate(-170deg) scale(.48)} }
      @keyframes break-four { 0%,67%{transform:translate(0) rotate(0)} 70%{transform:translate(5px,2px) rotate(6deg)} 82%,100%{transform:translate(155px,120px) rotate(230deg) scale(.42)} }
      @keyframes missile-flight { 0%,54%{opacity:0;transform:translate(218px,181px) rotate(-11deg) scale(.7)} 56%{opacity:1} 64%{opacity:1;transform:translate(360px,150px) rotate(-11deg) scale(.92)} 68%{opacity:1;transform:translate(432px,136px) rotate(-10deg) scale(1)} 69%,100%{opacity:0;transform:translate(440px,136px) scale(.2)} }
      @keyframes explosion { 0%,67%{opacity:0;transform:scale(.15)} 69%{opacity:1;transform:scale(.55)} 73%{opacity:1;transform:scale(1.5)} 82%,100%{opacity:0;transform:scale(3.1)} }
      @keyframes blast-rays { 0%,67%{opacity:0;transform:rotate(0) scale(.3)} 70%{opacity:1} 78%,100%{opacity:0;transform:rotate(220deg) scale(1.7)} }
      @keyframes debris { 0%,68%{opacity:0;transform:translateY(0) rotate(0) scale(.3)} 71%{opacity:1} 84%,100%{opacity:0;transform:translateY(115px) rotate(280deg) scale(1.25)} }
      @keyframes smoke { 0%,71%{opacity:0;transform:scale(.2)} 76%{opacity:.72;transform:scale(.8)} 91%,100%{opacity:0;transform:translateY(-22px) scale(2.5)} }
      @keyframes flash { 0%,67%{opacity:0} 68%{opacity:.92} 70%,100%{opacity:0} }
      @keyframes status { 0%,32%{opacity:0} 34%,66%{opacity:1} 68%,100%{opacity:0} }
      @keyframes reset { 0%,86%{opacity:0;transform:scale(.6)} 90%,96%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.25)} }
      @keyframes impact-shake { 0%,67%,72%,100%{transform:translate(0)} 68%{transform:translate(-5px,3px)} 69%{transform:translate(5px,-3px)} 70%{transform:translate(-3px,-2px)} 71%{transform:translate(2px,2px)} }
      @keyframes engine-pulse { from{transform:scaleX(.65);opacity:.55} to{transform:scaleX(1.35);opacity:1} }
      @keyframes speed-lines { from{transform:translateX(-90px);opacity:.18} to{transform:translateX(90px);opacity:.7} }
      @keyframes glint { from{opacity:.06} to{opacity:.35} }
      @keyframes twinkle { from{opacity:.18} to{opacity:1} }
      @keyframes spin { to{transform:rotate(360deg)} }
      @media (prefers-reduced-motion:reduce) {
        .combat-field,.tetro,.name-holder,.fragment,.tile-glint,.star { animation:none;opacity:1;transform:none }
        .speed-lines,.lead-jet,.chaser-jet,.sonic-ring,.missile,.explosion,.blast-rays,.debris,.smoke,.flash,.status,.reset { animation:none;opacity:0 }
      }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="880" height="300" rx="20" fill="#050810"/>
    <ellipse cx="440" cy="150" rx="360" ry="180" fill="url(#skyGlow)" filter="url(#soft)"/>
    <rect width="880" height="300" rx="20" fill="url(#grid)"/>
    <rect x="1" y="1" width="878" height="298" rx="19" fill="none" stroke="#26364d"/>
    <g fill="#dbeafe"><circle class="star s1" cx="46" cy="66" r="1.5"/><circle class="star s2" cx="170" cy="50" r="1.2"/><circle class="star s3" cx="295" cy="61" r="1.6"/><circle class="star s1" cx="585" cy="51" r="1.3"/><circle class="star s2" cx="720" cy="62" r="1.5"/><circle class="star s3" cx="835" cy="48" r="1.2"/><circle class="star s2" cx="70" cy="274" r="1.4"/><circle class="star s1" cx="812" cy="270" r="1.5"/></g>
    <g class="speed-lines" stroke="url(#rainbow)" stroke-width="2" stroke-linecap="round"><path d="M-70 90H95M20 122H145M-50 245H115M730 82H920M770 120H875M720 250H940"/></g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="2.5"><text x="28" y="30" fill="#64748b">ARCADE SORTIE</text><text x="852" y="30" text-anchor="end" fill="#64748b">AUTO LOOP <tspan fill="#22d3ee">●</tspan></text></g>
    <path d="M28 43H852" stroke="#26364d"/>

    <g class="combat-field">
      <rect x="128" y="62" width="624" height="182" rx="13" fill="url(#panel)" stroke="#22d3ee" stroke-opacity=".55"/>
      <path d="M128 213H752" stroke="#334155" stroke-dasharray="3 5"/>
      <path d="M440 62V244" stroke="#22d3ee" stroke-opacity=".06"/>

      <g class="tetro t1" fill="#22d3ee"><rect x="70" y="82" width="21" height="21" rx="3"/><rect x="91" y="82" width="21" height="21" rx="3"/><rect x="112" y="82" width="21" height="21" rx="3"/><rect x="91" y="103" width="21" height="21" rx="3"/></g>
      <g class="tetro t2" fill="#fbbf24"><rect x="753" y="68" width="21" height="21" rx="3"/><rect x="753" y="89" width="21" height="21" rx="3"/><rect x="753" y="110" width="21" height="21" rx="3"/><rect x="774" y="110" width="21" height="21" rx="3"/></g>
      <g class="tetro t3" fill="#4ade80"><rect x="87" y="202" width="21" height="21" rx="3"/><rect x="108" y="202" width="21" height="21" rx="3"/><rect x="66" y="223" width="21" height="21" rx="3"/><rect x="87" y="223" width="21" height="21" rx="3"/></g>
      <g class="tetro t4" fill="#fb7185"><rect x="774" y="187" width="21" height="21" rx="3"/><rect x="795" y="187" width="21" height="21" rx="3"/><rect x="795" y="208" width="21" height="21" rx="3"/><rect x="816" y="208" width="21" height="21" rx="3"/></g>
      <g class="tetro t5" fill="#a78bfa"><rect x="156" y="244" width="21" height="21" rx="3"/><rect x="177" y="244" width="21" height="21" rx="3"/><rect x="198" y="244" width="21" height="21" rx="3"/><rect x="219" y="244" width="21" height="21" rx="3"/></g>

      <g class="lead-jet" aria-hidden="true">
        <path d="M-118 0H-42" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity=".2"/>
        <path d="M-92 0H-40" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" opacity=".8"/>
        <g transform="scale(1.08)"><path d="M-44 0L15-10L52 0L15 10Z" fill="#e2e8f0" stroke="#67e8f9" stroke-width="2"/><path d="M-10-6L-34-34L13-12L28-5Z" fill="#0ea5e9" stroke="#67e8f9"/><path d="M-10 6L-34 34L13 12L28 5Z" fill="#0369a1" stroke="#38bdf8"/><path d="M-31-3L-42-19L-17-7Z" fill="#a78bfa"/><ellipse cx="12" cy="0" rx="12" ry="5" fill="#0f172a" stroke="#7dd3fc"/><path d="M46 0L52 0" stroke="#fff" stroke-width="2"/></g>
        <path class="engine" d="M-45-5L-78 0L-45 5Z" fill="#22d3ee"/><path class="engine" d="M-47-2L-66 0L-47 2Z" fill="#fff"/>
      </g>

      <circle class="sonic-ring" cx="440" cy="137" r="34" fill="none" stroke="#67e8f9" stroke-width="4" filter="url(#glow)"/>

      <g class="name-holder h1"><g class="fragment f1" filter="url(#glow)"><path d="M220 94L228 86H314L306 94Z" fill="#1d5b6b" stroke="#67e8f9"/><path d="M306 94L314 86V170L306 178Z" fill="#082f3b" stroke="#0891b2"/><rect x="220" y="94" width="86" height="84" rx="8" fill="#102a35" stroke="#22d3ee" stroke-width="2"/><path class="tile-glint" d="M230 101H284L240 171H224V126Z" fill="#ecfeff"/><text x="263" y="155" text-anchor="middle" fill="#ecfeff" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="57" font-weight="900">西</text></g></g>
      <g class="name-holder h2"><g class="fragment f2" filter="url(#glow)"><path d="M316 94L324 86H410L402 94Z" fill="#5b3f86" stroke="#c4b5fd"/><path d="M402 94L410 86V170L402 178Z" fill="#24143e" stroke="#7c3aed"/><rect x="316" y="94" width="86" height="84" rx="8" fill="#291f3d" stroke="#a78bfa" stroke-width="2"/><path class="tile-glint" d="M326 101H380L336 171H320V126Z" fill="#faf5ff"/><text x="359" y="155" text-anchor="middle" fill="#faf5ff" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="57" font-weight="900">原</text></g></g>
      <g class="name-holder h3"><g class="fragment f3" filter="url(#glow)"><path d="M478 94L486 86H572L564 94Z" fill="#745512" stroke="#fde68a"/><path d="M564 94L572 86V170L564 178Z" fill="#3b2804" stroke="#d97706"/><rect x="478" y="94" width="86" height="84" rx="8" fill="#35270d" stroke="#fbbf24" stroke-width="2"/><path class="tile-glint" d="M488 101H542L498 171H482V126Z" fill="#fffbeb"/><text x="521" y="155" text-anchor="middle" fill="#fffbeb" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="57" font-weight="900">一</text></g></g>
      <g class="name-holder h4"><g class="fragment f4" filter="url(#glow)"><path d="M574 94L582 86H668L660 94Z" fill="#22633e" stroke="#bbf7d0"/><path d="M660 94L668 86V170L660 178Z" fill="#0c3b22" stroke="#16a34a"/><rect x="574" y="94" width="86" height="84" rx="8" fill="#123322" stroke="#4ade80" stroke-width="2"/><path class="tile-glint" d="M584 101H638L594 171H578V126Z" fill="#f0fdf4"/><text x="617" y="155" text-anchor="middle" fill="#f0fdf4" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="57" font-weight="900">輝</text></g></g>

      <g class="status" font-family="ui-monospace,monospace" text-anchor="middle"><text x="440" y="81" fill="#22d3ee" font-size="9" letter-spacing="3">IDENTITY LOCKED</text><text x="440" y="202" fill="#94a3b8" font-size="10" letter-spacing="3">NISHIHARA // IKKI</text></g>

      <g class="chaser-jet" aria-hidden="true">
        <path d="M-102 0H-38" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity=".28"/><path d="M-78 0H-38" stroke="#fecdd3" stroke-width="2" opacity=".8"/>
        <g transform="scale(.88)"><path d="M-44 0L15-10L52 0L15 10Z" fill="#cbd5e1" stroke="#fb7185" stroke-width="2"/><path d="M-10-6L-34-31L13-12L28-5Z" fill="#be123c" stroke="#fb7185"/><path d="M-10 6L-34 31L13 12L28 5Z" fill="#7f1d1d" stroke="#f43f5e"/><ellipse cx="12" cy="0" rx="12" ry="5" fill="#111827" stroke="#fda4af"/></g>
        <path class="engine" d="M-40-4L-68 0L-40 4Z" fill="#fb7185"/>
      </g>

      <g class="missile" aria-hidden="true"><path d="M-58 0H-20" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity=".35"/><path class="missile-flame" d="M-20-4L-43 0L-20 4Z" fill="#f97316"/><path d="M-20-6H12L27 0L12 6H-20Z" fill="#f8fafc" stroke="#fb7185"/><path d="M-7-6L-16-15L6-7ZM-7 6L-16 15L6 7Z" fill="#ef4444"/></g>

      <g class="blast-rays" stroke-linecap="round" filter="url(#glow)"><path d="M440 76V48M440 226V198M380 137H350M530 137H500" stroke="#fde047" stroke-width="6"/><path d="M397 94L375 72M483 180L505 202M483 94L505 72M397 180L375 202" stroke="#fb7185" stroke-width="5"/></g>
      <circle class="explosion" cx="440" cy="137" r="43" fill="url(#blast)" filter="url(#glow)"/>
      <g class="debris" fill="url(#rainbow)" filter="url(#glow)"><rect x="342" y="126" width="10" height="10" rx="2"/><rect x="382" y="148" width="7" height="7" rx="1"/><rect x="418" y="118" width="9" height="9" rx="2"/><rect x="456" y="151" width="8" height="8" rx="1"/><rect x="493" y="121" width="11" height="11" rx="2"/><rect x="532" y="145" width="7" height="7" rx="1"/></g>
      <g class="smoke" fill="#64748b" filter="url(#soft)"><circle cx="410" cy="140" r="24"/><circle cx="445" cy="128" r="31"/><circle cx="478" cy="145" r="25"/></g>
      <rect class="flash" x="128" y="62" width="624" height="182" rx="13" fill="#fff"/>

      <g class="reset" font-family="ui-monospace,monospace" text-anchor="middle"><circle class="reset-ring" cx="440" cy="138" r="36" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="16 8" filter="url(#glow)"/><text x="440" y="136" fill="#e2e8f0" font-size="9" letter-spacing="2">RELOAD</text><text x="440" y="151" fill="#64748b" font-size="8" letter-spacing="2">NEXT LOOP</text></g>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle"><text x="440" y="276" fill="#e2e8f0" font-size="13" font-weight="800" letter-spacing="3">100 DAYS / 100 APPS</text><rect x="565" y="265" width="7" height="13" rx="1" fill="#22d3ee"/></g>
  </g>
</svg>
