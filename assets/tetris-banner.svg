<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title description">
  <title id="title">西原 一輝</title>
  <desc id="description">テトリス風のブロックが回転しながら落下し、立体的な西原 一輝の名前を組み上げて繰り返すアニメーション</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scanner" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auraCyan">
      <stop stop-color="#22d3ee" stop-opacity=".46"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraPink">
      <stop stop-color="#ec4899" stop-opacity=".38"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/><stop offset=".25" stop-color="#a78bfa"/><stop offset=".5" stop-color="#fb7185"/><stop offset=".75" stop-color="#fbbf24"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <style>
      .piece {
        opacity: 0;
        animation: piece-loop 12s cubic-bezier(.2,.78,.2,1) infinite both;
        transform-box: fill-box;
        transform-origin: center;
        filter: url(#glow);
      }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: .2s; }
      .p3 { animation-delay: .4s; }
      .p4 { animation-delay: .6s; }
      .p5 { animation-delay: .8s; }
      .p6 { animation-delay: 1s; }
      .name-rig {
        animation: rig-loop 12s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .name-tile {
        opacity: 0;
        animation: tile-loop 12s cubic-bezier(.22,.8,.2,1) infinite both;
        transform-box: fill-box;
        transform-origin: center;
        transform-style: preserve-3d;
      }
      .n1 { animation-delay: 0s; }
      .n2 { animation-delay: .14s; }
      .n3 { animation-delay: .28s; }
      .n4 { animation-delay: .42s; }
      .challenge { opacity: 0; animation: challenge-loop 12s ease-in-out infinite both; }
      .cursor { animation: blink .72s steps(1, end) infinite; }
      .scan-beam { opacity: 0; animation: scan-loop 12s linear infinite; }
      .clear-line { opacity: 0; animation: clear-loop 12s ease-out infinite; }
      .reset-mark { opacity: 0; animation: reset-loop 12s steps(6, end) infinite; transform-box: fill-box; transform-origin: center; }
      .reset-ring { animation: ring-spin 1.15s linear infinite; transform-box: fill-box; transform-origin: center; }
      .loop-dot { animation: loop-dot 1.1s ease-in-out infinite alternate; }
      .playfield { animation: field-pulse 3s ease-in-out infinite alternate; }
      .aura-a { animation: aura-a 5.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .aura-b { animation: aura-b 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .star { animation: twinkle 1.2s ease-in-out infinite alternate; }
      .s2 { animation-delay: -.4s; }.s3 { animation-delay: -.8s; }
      .burst-ring { opacity: 0; animation: burst-loop 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .burst-ring.r2 { animation-delay: .18s; }
      .spark-burst { opacity: 0; animation: spark-loop 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .combo { opacity: 0; animation: combo-loop 12s steps(5, end) infinite; transform-box: fill-box; transform-origin: center; }
      .tile-glint { animation: glint-loop 1.4s ease-in-out infinite alternate; }
      .screen-flash { opacity: 0; animation: flash-loop 12s ease-out infinite; }
      .debris-cloud { opacity: 0; animation: debris-loop 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes piece-loop {
        0%, 2% { opacity: 0; transform: translateY(-300px) rotate(0deg) scale(.65); }
        8% { opacity: 1; }
        15% { transform: translateY(-145px) rotate(90deg) scale(.86); }
        23% { opacity: 1; transform: translateY(8px) rotate(180deg) scale(1); }
        27%, 70% { opacity: 1; transform: translateY(0) rotate(180deg) scale(1); }
        76% { opacity: 1; transform: translateY(-8px) rotate(540deg) scale(1.08); }
        84%, 100% { opacity: 0; transform: translateY(330px) rotate(720deg) scale(.55); }
      }
      @keyframes tile-loop {
        0%, 21% { opacity: 0; transform: perspective(520px) translateY(-86px) rotateX(-70deg) rotateY(-110deg) scale(.55); }
        29% { opacity: 1; transform: perspective(520px) translateY(7px) rotateX(8deg) rotateY(18deg) scale(1.06); }
        34% { opacity: 1; transform: perspective(520px) translateY(0) rotateX(0deg) rotateY(0deg) scale(1); }
        45% { transform: perspective(520px) translateY(-6px) rotateX(8deg) rotateY(-13deg) scale(1.02); }
        56% { transform: perspective(520px) translateY(3px) rotateX(-6deg) rotateY(12deg) scale(.99); }
        67% { transform: perspective(520px) translateY(-5px) rotateX(7deg) rotateY(-10deg) scale(1.02); }
        73% { opacity: 1; transform: perspective(520px) translateY(0) rotateX(0deg) rotateY(0deg) scale(1); }
        82%, 100% { opacity: 0; transform: perspective(520px) translateY(100px) rotateX(180deg) rotateY(270deg) scale(.25); }
      }
      @keyframes rig-loop {
        0%, 31% { transform: translateY(0) rotate(0deg) skewX(0deg); }
        42% { transform: translateY(-4px) rotate(-1.6deg) skewX(-1deg); }
        54% { transform: translateY(3px) rotate(1.4deg) skewX(1deg); }
        66% { transform: translateY(-3px) rotate(-1deg) skewX(-.6deg); }
        75%, 100% { transform: translateY(0) rotate(0deg) skewX(0deg); }
      }
      @keyframes challenge-loop { 0%, 30%, 86%, 100% { opacity: 0; transform: translateY(8px); } 37%, 78% { opacity: 1; transform: translateY(0); } }
      @keyframes scan-loop { 0%, 34% { opacity: 0; transform: translateX(0); } 38% { opacity: .9; } 68% { opacity: .9; transform: translateX(584px); } 72%, 100% { opacity: 0; transform: translateX(584px); } }
      @keyframes clear-loop { 0%, 72% { opacity: 0; transform: scaleX(.05); } 76% { opacity: 1; transform: scaleX(1); } 81%, 100% { opacity: 0; transform: scaleX(1); } }
      @keyframes reset-loop { 0%, 82% { opacity: 0; transform: scale(.6); } 87%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.3); } }
      @keyframes ring-spin { to { transform: rotate(360deg); } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes loop-dot { from { opacity: .25; } to { opacity: 1; } }
      @keyframes field-pulse { from { stroke: #263244; } to { stroke: #22d3ee; } }
      @keyframes aura-a { from { opacity: .45; transform: translate(-24px,-8px) scale(.86); } to { opacity: .9; transform: translate(38px,12px) scale(1.22); } }
      @keyframes aura-b { from { opacity: .35; transform: translate(30px,16px) scale(1.15); } to { opacity: .8; transform: translate(-44px,-12px) scale(.88); } }
      @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
      @keyframes burst-loop { 0%, 25% { opacity: 0; transform: scale(.25); } 29% { opacity: 1; } 40%, 100% { opacity: 0; transform: scale(4.2); } }
      @keyframes spark-loop { 0%, 27% { opacity: 0; transform: rotate(0deg) scale(.3); } 32% { opacity: 1; } 58% { opacity: .85; transform: rotate(165deg) scale(1.15); } 73%, 100% { opacity: 0; transform: rotate(310deg) scale(1.55); } }
      @keyframes combo-loop { 0%, 30% { opacity: 0; transform: scale(.5) rotate(-8deg); } 34% { opacity: 1; transform: scale(1.3) rotate(4deg); } 39%, 70% { opacity: 1; transform: scale(1) rotate(0deg); } 76%, 100% { opacity: 0; transform: scale(1.5) rotate(8deg); } }
      @keyframes glint-loop { from { opacity: .06; } to { opacity: .4; } }
      @keyframes flash-loop { 0%, 74% { opacity: 0; } 76% { opacity: .82; } 79%, 100% { opacity: 0; } }
      @keyframes debris-loop { 0%, 74% { opacity: 0; transform: translateY(0) rotate(0deg) scale(.35); } 77% { opacity: 1; } 84%, 100% { opacity: 0; transform: translateY(-92px) rotate(260deg) scale(1.45); } }
      @media (prefers-reduced-motion: reduce) {
        .piece, .name-rig, .name-tile, .challenge, .cursor, .scan-beam, .clear-line, .reset-mark, .reset-ring, .loop-dot, .playfield, .aura-a, .aura-b, .star, .burst-ring, .spark-burst, .combo, .tile-glint, .screen-flash, .debris-cloud { animation: none; opacity: 1; transform: none; }
        .scan-beam, .clear-line, .reset-mark, .burst-ring, .spark-burst, .combo, .screen-flash, .debris-cloud { opacity: 0; }
        .tile-glint { opacity: .16; }
      }
    </style>
  </defs>

  <rect width="880" height="300" rx="20" fill="#070a11"/>
  <rect x="1" y="1" width="878" height="298" rx="19" fill="none" stroke="#263244"/>
  <rect x="1" y="1" width="878" height="298" rx="19" fill="url(#grid)"/>

  <g aria-hidden="true">
    <ellipse class="aura-a" cx="250" cy="142" rx="190" ry="105" fill="url(#auraCyan)" filter="url(#softBlur)"/>
    <ellipse class="aura-b" cx="650" cy="150" rx="185" ry="110" fill="url(#auraPink)" filter="url(#softBlur)"/>
    <g fill="#e0f2fe">
      <circle class="star s1" cx="50" cy="61" r="1.8"/><circle class="star s2" cx="184" cy="43" r="1.3"/><circle class="star s3" cx="305" cy="54" r="1.6"/>
      <circle class="star s2" cx="566" cy="51" r="1.4"/><circle class="star s1" cx="708" cy="48" r="1.8"/><circle class="star s3" cx="828" cy="65" r="1.3"/>
      <circle class="star s3" cx="55" cy="274" r="1.5"/><circle class="star s1" cx="341" cy="283" r="1.2"/><circle class="star s2" cx="824" cy="267" r="1.7"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">
    <text x="30" y="31" fill="#64748b">PLAYER 01</text>
    <text x="850" y="31" text-anchor="end" fill="#64748b">LOOP <tspan class="loop-dot" fill="#22d3ee">●</tspan></text>
  </g>
  <path d="M30 43H850" stroke="#263244"/>

  <rect class="playfield" x="143" y="65" width="594" height="174" rx="12" fill="url(#panel)" stroke="#263244"/>
  <path d="M143 209H737" stroke="#334155" stroke-dasharray="3 5"/>

  <g aria-hidden="true">
    <circle class="burst-ring r1" cx="440" cy="136" r="30" fill="none" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/>
    <circle class="burst-ring r2" cx="440" cy="136" r="24" fill="none" stroke="#f0abfc" stroke-width="3" filter="url(#glow)"/>
    <g class="spark-burst" stroke-linecap="round" filter="url(#glow)">
      <path d="M440 68V48M440 224V204M372 136H352M528 136H508" stroke="#22d3ee" stroke-width="4"/>
      <path d="M392 88L378 74M502 198L488 184M488 88L502 74M378 198L392 184" stroke="#fbbf24" stroke-width="4"/>
      <path d="M414 72L407 55M473 217L466 200M504 110L522 103M358 169L376 162" stroke="#fb7185" stroke-width="3"/>
    </g>
  </g>

  <!-- Falling tetrominoes -->
  <g class="piece p1" fill="#22d3ee" stroke="#a5f3fc" stroke-opacity=".45">
    <rect x="83" y="73" width="22" height="22" rx="3"/><rect x="105" y="73" width="22" height="22" rx="3"/>
    <rect x="127" y="73" width="22" height="22" rx="3"/><rect x="105" y="95" width="22" height="22" rx="3"/>
  </g>
  <g class="piece p2" fill="#fbbf24" stroke="#fef3c7" stroke-opacity=".45">
    <rect x="737" y="65" width="22" height="22" rx="3"/><rect x="737" y="87" width="22" height="22" rx="3"/>
    <rect x="737" y="109" width="22" height="22" rx="3"/><rect x="759" y="109" width="22" height="22" rx="3"/>
  </g>
  <g class="piece p3" fill="#4ade80" stroke="#bbf7d0" stroke-opacity=".45">
    <rect x="99" y="195" width="22" height="22" rx="3"/><rect x="121" y="195" width="22" height="22" rx="3"/>
    <rect x="77" y="217" width="22" height="22" rx="3"/><rect x="99" y="217" width="22" height="22" rx="3"/>
  </g>
  <g class="piece p4" fill="#fb7185" stroke="#fecdd3" stroke-opacity=".45">
    <rect x="759" y="173" width="22" height="22" rx="3"/><rect x="781" y="173" width="22" height="22" rx="3"/>
    <rect x="781" y="195" width="22" height="22" rx="3"/><rect x="803" y="195" width="22" height="22" rx="3"/>
  </g>
  <g class="piece p5" fill="#a78bfa" stroke="#ddd6fe" stroke-opacity=".45">
    <rect x="143" y="239" width="22" height="22" rx="3"/><rect x="165" y="239" width="22" height="22" rx="3"/>
    <rect x="187" y="239" width="22" height="22" rx="3"/><rect x="209" y="239" width="22" height="22" rx="3"/>
  </g>
  <g class="piece p6" fill="#38bdf8" stroke="#bae6fd" stroke-opacity=".45">
    <rect x="693" y="239" width="22" height="22" rx="3"/><rect x="715" y="239" width="22" height="22" rx="3"/>
    <rect x="693" y="261" width="22" height="22" rx="3"/><rect x="715" y="261" width="22" height="22" rx="3"/>
  </g>

  <!-- The extruded name builds, floats and tumbles away as one continuous loop -->
  <g class="name-rig">
  <g class="name-tile n1" filter="url(#glow)">
    <path d="M220 92L228 84H314L306 92Z" fill="#1d5b6b" stroke="#67e8f9" stroke-opacity=".75"/>
    <path d="M306 92L314 84V170L306 178Z" fill="#082f3b" stroke="#0891b2"/>
    <rect x="220" y="92" width="86" height="86" rx="8" fill="#102a35" stroke="#22d3ee" stroke-width="2"/>
    <path class="tile-glint" d="M230 99H284L240 171H224V126Z" fill="#ecfeff"/>
    <text x="263" y="154" text-anchor="middle" fill="#ecfeff" font-family="ui-sans-serif, system-ui, 'Noto Sans JP', sans-serif" font-size="58" font-weight="800">西</text>
  </g>
  <g class="name-tile n2" filter="url(#glow)">
    <path d="M316 92L324 84H410L402 92Z" fill="#5b3f86" stroke="#c4b5fd" stroke-opacity=".75"/>
    <path d="M402 92L410 84V170L402 178Z" fill="#24143e" stroke="#7c3aed"/>
    <rect x="316" y="92" width="86" height="86" rx="8" fill="#291f3d" stroke="#a78bfa" stroke-width="2"/>
    <path class="tile-glint" d="M326 99H380L336 171H320V126Z" fill="#faf5ff"/>
    <text x="359" y="154" text-anchor="middle" fill="#faf5ff" font-family="ui-sans-serif, system-ui, 'Noto Sans JP', sans-serif" font-size="58" font-weight="800">原</text>
  </g>
  <g class="name-tile n3" filter="url(#glow)">
    <path d="M478 92L486 84H572L564 92Z" fill="#745512" stroke="#fde68a" stroke-opacity=".75"/>
    <path d="M564 92L572 84V170L564 178Z" fill="#3b2804" stroke="#d97706"/>
    <rect x="478" y="92" width="86" height="86" rx="8" fill="#35270d" stroke="#fbbf24" stroke-width="2"/>
    <path class="tile-glint" d="M488 99H542L498 171H482V126Z" fill="#fffbeb"/>
    <text x="521" y="154" text-anchor="middle" fill="#fffbeb" font-family="ui-sans-serif, system-ui, 'Noto Sans JP', sans-serif" font-size="58" font-weight="800">一</text>
  </g>
  <g class="name-tile n4" filter="url(#glow)">
    <path d="M574 92L582 84H668L660 92Z" fill="#22633e" stroke="#bbf7d0" stroke-opacity=".75"/>
    <path d="M660 92L668 84V170L660 178Z" fill="#0c3b22" stroke="#16a34a"/>
    <rect x="574" y="92" width="86" height="86" rx="8" fill="#123322" stroke="#4ade80" stroke-width="2"/>
    <path class="tile-glint" d="M584 99H638L594 171H578V126Z" fill="#f0fdf4"/>
    <text x="617" y="154" text-anchor="middle" fill="#f0fdf4" font-family="ui-sans-serif, system-ui, 'Noto Sans JP', sans-serif" font-size="58" font-weight="800">輝</text>
  </g>
  </g>

  <g class="combo" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" filter="url(#glow)">
    <text x="440" y="125" fill="#f8fafc" font-size="8" font-weight="700" letter-spacing="2">COMBO</text>
    <text x="440" y="151" fill="url(#rainbow)" font-size="24" font-weight="900">×4</text>
  </g>

  <rect class="scan-beam" x="145" y="68" width="8" height="136" fill="url(#scanner)" filter="url(#glow)"/>
  <rect class="clear-line" x="145" y="205" width="590" height="7" rx="3.5" fill="#ecfeff" filter="url(#glow)"/>
  <g class="debris-cloud" fill="url(#rainbow)" filter="url(#glow)" aria-hidden="true">
    <rect x="210" y="203" width="9" height="9" rx="2"/><rect x="270" y="207" width="6" height="6" rx="1"/><rect x="335" y="201" width="11" height="11" rx="2"/>
    <rect x="402" y="205" width="7" height="7" rx="1"/><rect x="468" y="201" width="10" height="10" rx="2"/><rect x="535" y="206" width="7" height="7" rx="1"/>
    <rect x="600" y="202" width="10" height="10" rx="2"/><rect x="665" y="205" width="7" height="7" rx="1"/>
  </g>
  <rect class="screen-flash" x="1" y="1" width="878" height="298" rx="19" fill="url(#rainbow)"/>
  <g class="reset-mark" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <circle class="reset-ring" cx="440" cy="138" r="38" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="20 10" filter="url(#glow)"/>
    <text x="440" y="135" fill="#e2e8f0" font-size="10" font-weight="700" letter-spacing="2">NEXT</text>
    <text x="440" y="150" fill="#94a3b8" font-size="9" letter-spacing="2">ROUND</text>
  </g>

  <g class="challenge" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="440" y="201" fill="#94a3b8" font-size="11" letter-spacing="4">DROP · BUILD · REPEAT</text>
    <text x="440" y="274" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="3">100 DAYS / 100 APPS</text>
    <rect class="cursor" x="565" y="263" width="7" height="13" rx="1" fill="#22d3ee"/>
  </g>
</svg>
