<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title description" overflow="hidden">
  <title id="title">西原 一輝 — Neon Air Combat Loop</title>
  <desc id="description">テトリス風ブロックが落下し、架空の戦闘機が飛来して西原 一輝の名前を出現させ、追撃機のミサイルで名前が砕けて再び始まるアニメーション</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b2c"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".3" stop-color="#a78bfa"/><stop offset=".55" stop-color="#fb7185"/><stop offset=".78" stop-color="#fbbf24"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <radialGradient id="skyGlow"><stop stop-color="#0ea5e9" stop-opacity=".28"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".1"/><stop offset="1" stop-color="#070a11" stop-opacity="0"/></radialGradient>
    <radialGradient id="blast"><stop stop-color="#fff"/><stop offset=".22" stop-color="#fde047"/><stop offset=".58" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="frameClip"><rect width="560" height="340" rx="20"/></clipPath>
    <style>
      .combat-field{animation:impact-shake 8.4s linear infinite;transform-box:fill-box;transform-origin:center}.speed-lines{animation:speed-lines .62s linear infinite}.star{animation:twinkle .9s ease-in-out infinite alternate}.s2{animation-delay:-.3s}.s3{animation-delay:-.6s}
      .tetro{opacity:0;animation:tetris-fall 8.4s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center;filter:url(#glow)}.t2{animation-delay:.08s}.t3{animation-delay:.16s}.t4{animation-delay:.24s}
      .lead-jet{opacity:0;animation:lead-flight 8.4s cubic-bezier(.18,.72,.22,1) infinite;transform-box:fill-box;transform-origin:center;filter:url(#glow)}.chaser-jet{opacity:0;animation:chase-flight 8.4s cubic-bezier(.2,.68,.2,1) infinite;transform-box:fill-box;transform-origin:center;filter:url(#glow)}
      .engine{animation:engine-pulse .16s steps(2,end) infinite alternate;transform-box:fill-box;transform-origin:right center}.sonic-ring{opacity:0;animation:sonic-boom 8.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .name-holder{opacity:0;animation:name-reveal 8.4s cubic-bezier(.18,.85,.2,1) infinite;transform-box:fill-box;transform-origin:center}.h2{animation-delay:.06s}.h3{animation-delay:.12s}.h4{animation-delay:.18s}.fragment{transform-box:fill-box;transform-origin:center}.f1{animation:break-one 8.4s ease-in infinite}.f2{animation:break-two 8.4s ease-in infinite}.f3{animation:break-three 8.4s ease-in infinite}.f4{animation:break-four 8.4s ease-in infinite}.tile-glint{animation:glint .7s ease-in-out infinite alternate}
      .missile{opacity:0;animation:missile-flight 8.4s cubic-bezier(.35,.15,.72,.55) infinite;transform-box:fill-box;transform-origin:center;filter:url(#glow)}.missile-flame{animation:engine-pulse .1s steps(2,end) infinite alternate;transform-box:fill-box;transform-origin:right center}
      .explosion{opacity:0;animation:explosion 8.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.blast-rays{opacity:0;animation:blast-rays 8.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.debris{opacity:0;animation:debris 8.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.smoke{opacity:0;animation:smoke 8.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.flash{opacity:0;animation:flash 8.4s steps(2,end) infinite}.status{opacity:0;animation:status 8.4s steps(1,end) infinite}.reset{opacity:0;animation:reset 8.4s steps(5,end) infinite;transform-box:fill-box;transform-origin:center}.reset-ring{animation:spin .7s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes tetris-fall{0%,2%{opacity:0;transform:translateY(-320px) rotate(0) scale(.65)}7%{opacity:1}15%{transform:translateY(-145px) rotate(90deg) scale(.9)}20%,25%{opacity:1;transform:translateY(0) rotate(180deg) scale(1)}29%{opacity:0;transform:translateY(4px) rotate(270deg) scale(1.35)}30%,100%{opacity:0}}
      @keyframes lead-flight{0%,16%{opacity:0;transform:translate(-135px,260px) rotate(-15deg) scale(.66)}18%{opacity:1}30%{opacity:1;transform:translate(235px,145px) rotate(-9deg) scale(.88)}42%{opacity:1;transform:translate(660px,55px) rotate(-6deg) scale(.72)}43%,100%{opacity:0;transform:translate(660px,55px)}}
      @keyframes chase-flight{0%,34%{opacity:0;transform:translate(-130px,286px) rotate(-14deg) scale(.58)}36%{opacity:1}50%{opacity:1;transform:translate(10px,228px) rotate(-10deg) scale(.72)}63%{opacity:1;transform:translate(30px,202px) rotate(-8deg) scale(.78)}72%{opacity:.8;transform:translate(330px,126px) rotate(-7deg) scale(.64)}78%,100%{opacity:0;transform:translate(620px,72px) scale(.5)}}
      @keyframes sonic-boom{0%,29%{opacity:0;transform:scale(.2)}32%{opacity:1;transform:scale(.5)}42%,100%{opacity:0;transform:scale(4)}}
      @keyframes name-reveal{0%,29%{opacity:0;transform:perspective(440px) scale(.35) rotateY(-100deg)}34%{opacity:1;transform:perspective(440px) scale(1.14) rotateY(12deg)}38%,67%{opacity:1;transform:perspective(440px) scale(1) rotateY(0)}72%{opacity:1}82%,100%{opacity:0}}
      @keyframes break-one{0%,67%{transform:translate(0) rotate(0)}70%{transform:translate(-4px,3px) rotate(-4deg)}82%,100%{transform:translate(-100px,155px) rotate(-220deg) scale(.42)}}@keyframes break-two{0%,67%{transform:translate(0) rotate(0)}70%{transform:translate(3px,-3px) rotate(5deg)}82%,100%{transform:translate(-38px,175px) rotate(160deg) scale(.46)}}@keyframes break-three{0%,67%{transform:translate(0) rotate(0)}70%{transform:translate(-2px,-4px) rotate(-5deg)}82%,100%{transform:translate(48px,172px) rotate(-170deg) scale(.45)}}@keyframes break-four{0%,67%{transform:translate(0) rotate(0)}70%{transform:translate(5px,2px) rotate(6deg)}82%,100%{transform:translate(105px,145px) rotate(230deg) scale(.4)}}
      @keyframes missile-flight{0%,54%{opacity:0;transform:translate(145px,214px) rotate(-16deg) scale(.58)}56%{opacity:1}64%{opacity:1;transform:translate(238px,177px) rotate(-16deg) scale(.78)}68%{opacity:1;transform:translate(274px,162px) rotate(-15deg) scale(.9)}69%,100%{opacity:0;transform:translate(280px,160px) scale(.2)}}
      @keyframes explosion{0%,67%{opacity:0;transform:scale(.15)}69%{opacity:1;transform:scale(.55)}73%{opacity:1;transform:scale(1.4)}82%,100%{opacity:0;transform:scale(2.8)}}@keyframes blast-rays{0%,67%{opacity:0;transform:rotate(0) scale(.3)}70%{opacity:1}78%,100%{opacity:0;transform:rotate(220deg) scale(1.55)}}@keyframes debris{0%,68%{opacity:0;transform:translateY(0) rotate(0) scale(.3)}71%{opacity:1}84%,100%{opacity:0;transform:translateY(128px) rotate(280deg) scale(1.2)}}@keyframes smoke{0%,71%{opacity:0;transform:scale(.2)}76%{opacity:.72;transform:scale(.8)}91%,100%{opacity:0;transform:translateY(-22px) scale(2.35)}}@keyframes flash{0%,67%{opacity:0}68%{opacity:.92}70%,100%{opacity:0}}@keyframes status{0%,32%{opacity:0}34%,66%{opacity:1}68%,100%{opacity:0}}@keyframes reset{0%,86%{opacity:0;transform:scale(.6)}90%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
      @keyframes impact-shake{0%,67%,72%,100%{transform:translate(0)}68%{transform:translate(-5px,3px)}69%{transform:translate(5px,-3px)}70%{transform:translate(-3px,-2px)}71%{transform:translate(2px,2px)}}@keyframes engine-pulse{from{transform:scaleX(.65);opacity:.55}to{transform:scaleX(1.35);opacity:1}}@keyframes speed-lines{from{transform:translateX(-70px);opacity:.18}to{transform:translateX(70px);opacity:.7}}@keyframes glint{from{opacity:.06}to{opacity:.35}}@keyframes twinkle{from{opacity:.18}to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.combat-field,.tetro,.name-holder,.fragment,.tile-glint,.star{animation:none;opacity:1;transform:none}.speed-lines,.lead-jet,.chaser-jet,.sonic-ring,.missile,.explosion,.blast-rays,.debris,.smoke,.flash,.status,.reset{animation:none;opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="560" height="340" rx="20" fill="#050810"/><ellipse cx="280" cy="168" rx="250" ry="190" fill="url(#skyGlow)" filter="url(#soft)"/><rect width="560" height="340" rx="20" fill="url(#grid)"/><rect x="1" y="1" width="558" height="338" rx="19" fill="none" stroke="#26364d"/>
    <g fill="#dbeafe"><circle class="star s1" cx="28" cy="60" r="1.4"/><circle class="star s2" cx="142" cy="51" r="1.2"/><circle class="star s3" cx="420" cy="57" r="1.4"/><circle class="star s1" cx="530" cy="65" r="1.3"/><circle class="star s2" cx="42" cy="318" r="1.3"/><circle class="star s3" cx="514" cy="310" r="1.4"/></g>
    <g class="speed-lines" stroke="url(#rainbow)" stroke-width="2" stroke-linecap="round"><path d="M-55 96H62M12 130H108M-40 282H76M468 90H620M500 132H584M458 286H630"/></g>
    <g font-family="ui-monospace,monospace" font-size="9" letter-spacing="2"><text x="22" y="28" fill="#64748b">ARCADE SORTIE</text><text x="538" y="28" text-anchor="end" fill="#64748b">AUTO <tspan fill="#22d3ee">●</tspan></text></g><path d="M22 40H538" stroke="#26364d"/>

    <g class="combat-field">
      <rect x="35" y="66" width="490" height="215" rx="13" fill="url(#panel)" stroke="#22d3ee" stroke-opacity=".55"/><path d="M35 235H525" stroke="#334155" stroke-dasharray="3 5"/>
      <g class="tetro t1" fill="#22d3ee"><rect x="18" y="79" width="19" height="19" rx="3"/><rect x="37" y="79" width="19" height="19" rx="3"/><rect x="56" y="79" width="19" height="19" rx="3"/><rect x="37" y="98" width="19" height="19" rx="3"/></g>
      <g class="tetro t2" fill="#fbbf24"><rect x="502" y="72" width="19" height="19" rx="3"/><rect x="502" y="91" width="19" height="19" rx="3"/><rect x="502" y="110" width="19" height="19" rx="3"/><rect x="521" y="110" width="19" height="19" rx="3"/></g>
      <g class="tetro t3" fill="#4ade80"><rect x="37" y="225" width="19" height="19" rx="3"/><rect x="56" y="225" width="19" height="19" rx="3"/><rect x="18" y="244" width="19" height="19" rx="3"/><rect x="37" y="244" width="19" height="19" rx="3"/></g>
      <g class="tetro t4" fill="#fb7185"><rect x="502" y="216" width="19" height="19" rx="3"/><rect x="521" y="216" width="19" height="19" rx="3"/><rect x="521" y="235" width="19" height="19" rx="3"/><rect x="540" y="235" width="19" height="19" rx="3"/></g>

      <g class="lead-jet" aria-hidden="true"><path d="M-94 0H-38" stroke="#22d3ee" stroke-width="4" opacity=".28"/><path d="M-70 0H-36" stroke="#a5f3fc" stroke-width="2"/><g transform="scale(.9)"><path d="M-44 0L15-10L52 0L15 10Z" fill="#e2e8f0" stroke="#67e8f9" stroke-width="2"/><path d="M-10-6L-34-32L13-12L28-5Z" fill="#0ea5e9"/><path d="M-10 6L-34 32L13 12L28 5Z" fill="#0369a1"/><ellipse cx="12" cy="0" rx="12" ry="5" fill="#0f172a" stroke="#7dd3fc"/></g><path class="engine" d="M-40-4L-68 0L-40 4Z" fill="#22d3ee"/></g>
      <circle class="sonic-ring" cx="280" cy="160" r="31" fill="none" stroke="#67e8f9" stroke-width="4" filter="url(#glow)"/>

      <g class="name-holder h1"><g class="fragment f1" filter="url(#glow)"><rect x="64" y="121" width="76" height="76" rx="8" fill="#102a35" stroke="#22d3ee" stroke-width="2"/><path d="M64 121L71 114H147L140 121Z" fill="#1d5b6b" stroke="#67e8f9"/><path class="tile-glint" d="M72 128H122L82 190H68V149Z" fill="#ecfeff"/><text x="102" y="175" text-anchor="middle" fill="#ecfeff" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="49" font-weight="900">西</text></g></g>
      <g class="name-holder h2"><g class="fragment f2" filter="url(#glow)"><rect x="148" y="121" width="76" height="76" rx="8" fill="#291f3d" stroke="#a78bfa" stroke-width="2"/><path d="M148 121L155 114H231L224 121Z" fill="#5b3f86" stroke="#c4b5fd"/><path class="tile-glint" d="M156 128H206L166 190H152V149Z" fill="#faf5ff"/><text x="186" y="175" text-anchor="middle" fill="#faf5ff" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="49" font-weight="900">原</text></g></g>
      <g class="name-holder h3"><g class="fragment f3" filter="url(#glow)"><rect x="336" y="121" width="76" height="76" rx="8" fill="#35270d" stroke="#fbbf24" stroke-width="2"/><path d="M336 121L343 114H419L412 121Z" fill="#745512" stroke="#fde68a"/><path class="tile-glint" d="M344 128H394L354 190H340V149Z" fill="#fffbeb"/><text x="374" y="175" text-anchor="middle" fill="#fffbeb" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="49" font-weight="900">一</text></g></g>
      <g class="name-holder h4"><g class="fragment f4" filter="url(#glow)"><rect x="420" y="121" width="76" height="76" rx="8" fill="#123322" stroke="#4ade80" stroke-width="2"/><path d="M420 121L427 114H503L496 121Z" fill="#22633e" stroke="#bbf7d0"/><path class="tile-glint" d="M428 128H478L438 190H424V149Z" fill="#f0fdf4"/><text x="458" y="175" text-anchor="middle" fill="#f0fdf4" font-family="system-ui,'Noto Sans JP',sans-serif" font-size="49" font-weight="900">輝</text></g></g>
      <g class="status" font-family="ui-monospace,monospace" text-anchor="middle"><text x="280" y="108" fill="#22d3ee" font-size="8" letter-spacing="2">IDENTITY LOCKED</text><text x="280" y="224" fill="#94a3b8" font-size="9" letter-spacing="2">NISHIHARA // IKKI</text></g>

      <g class="chaser-jet" aria-hidden="true"><path d="M-82 0H-34" stroke="#fb7185" stroke-width="4" opacity=".3"/><g transform="scale(.72)"><path d="M-44 0L15-10L52 0L15 10Z" fill="#cbd5e1" stroke="#fb7185" stroke-width="2"/><path d="M-10-6L-34-30L13-12L28-5Z" fill="#be123c"/><path d="M-10 6L-34 30L13 12L28 5Z" fill="#7f1d1d"/><ellipse cx="12" cy="0" rx="12" ry="5" fill="#111827" stroke="#fda4af"/></g><path class="engine" d="M-34-3L-58 0L-34 3Z" fill="#fb7185"/></g>
      <g class="missile" aria-hidden="true"><path d="M-45 0H-18" stroke="#94a3b8" stroke-width="4" opacity=".35"/><path class="missile-flame" d="M-18-3L-36 0L-18 3Z" fill="#f97316"/><path d="M-18-5H10L23 0L10 5H-18Z" fill="#f8fafc" stroke="#fb7185"/><path d="M-5-5L-13-12L5-6ZM-5 5L-13 12L5 6Z" fill="#ef4444"/></g>

      <g class="blast-rays" stroke-linecap="round" filter="url(#glow)"><path d="M280 102V78M280 242V218M222 160H198M362 160H338" stroke="#fde047" stroke-width="6"/><path d="M239 119L221 101M321 201L339 219M321 119L339 101M239 201L221 219" stroke="#fb7185" stroke-width="5"/></g><circle class="explosion" cx="280" cy="160" r="39" fill="url(#blast)" filter="url(#glow)"/>
      <g class="debris" fill="url(#rainbow)" filter="url(#glow)"><rect x="192" y="149" width="9" height="9" rx="2"/><rect x="226" y="171" width="7" height="7" rx="1"/><rect x="260" y="141" width="9" height="9" rx="2"/><rect x="294" y="173" width="8" height="8" rx="1"/><rect x="330" y="144" width="10" height="10" rx="2"/><rect x="365" y="168" width="7" height="7" rx="1"/></g>
      <g class="smoke" fill="#64748b" filter="url(#soft)"><circle cx="252" cy="163" r="22"/><circle cx="282" cy="151" r="28"/><circle cx="311" cy="166" r="23"/></g><rect class="flash" x="35" y="66" width="490" height="215" rx="13" fill="#fff"/>
      <g class="reset" font-family="ui-monospace,monospace" text-anchor="middle"><circle class="reset-ring" cx="280" cy="162" r="34" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="15 8" filter="url(#glow)"/><text x="280" y="160" fill="#e2e8f0" font-size="9" letter-spacing="2">RELOAD</text><text x="280" y="175" fill="#64748b" font-size="8" letter-spacing="2">NEXT LOOP</text></g>
    </g>

    <g font-family="ui-monospace,monospace" text-anchor="middle"><text x="280" y="315" fill="#e2e8f0" font-size="13" font-weight="800" letter-spacing="3">100 DAYS / 100 APPS</text><rect x="405" y="304" width="7" height="13" rx="1" fill="#22d3ee"/></g>
  </g>
</svg>
