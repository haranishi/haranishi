<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 2" width="880" height="2" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <!-- Stands in for a Markdown horizontal rule, which GitHub paints as a 4px slab in the
       neutral border colour: four times the weight of the 1px line under a heading, so the
       least meaningful element on the page ends up the heaviest. Violet reads on both themes.
       Note for editors: XML forbids a double hyphen inside a comment. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="880" height="2" fill="url(#fade)"/>
</svg>
